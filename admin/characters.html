<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexoverse — Crear Personaje</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <script src="../js/admin-guard.js"></script>
  <div class="topbar">
    <div class="brand"><a href="../index.html" style="text-decoration:none;color:inherit;">NEXOVERSE</a></div>
    <a class="btn secondary" href="dashboard.html">Volver</a>
  </div>
  <div class="container">
    <div class="section-title">Crear Personaje</div>
    <div class="section-sub">Cada personaje tiene 5 pasivas; se desbloquean progresivamente según la rareza en la que caiga cada copia.</div>

    <form class="builder" id="form" onsubmit="return false;">
      <div class="row">
        <div class="field">
          <label>Nombre</label>
          <input id="nombre" required />
        </div>
        <div class="field">
          <label>Rareza base (con la que dropea de cofres)</label>
          <select id="rareza">
            <option value="comun">Común</option>
            <option value="raro">Raro</option>
            <option value="especial">Especial</option>
            <option value="epico">Épico</option>
            <option value="legendario">Legendario</option>
          </select>
        </div>
        <div class="field">
          <label>URL de la imagen del personaje</label>
          <input id="imagenUrl" placeholder="https://…/madara.png" />
        </div>
      </div>
      <div class="row">
        <div class="field" style="max-width:140px;">
          <label>Vista previa</label>
          <div class="card comun" style="width:100%;" id="previewCard">
            <div class="art" id="previewArt">🂠</div>
          </div>
        </div>
      </div>

      <div class="block-box">
        <h4>Movimientos (siempre 4: Básico, Especial, Especial, Ultimate)</h4>
        <div id="movimientos"></div>
      </div>

      <div class="block-box">
        <h4>Pasivas (5, desbloqueo por rareza)</h4>
        <div class="effects-list" id="effectSlots"></div>
      </div>

      <button class="btn" onclick="guardar()">Guardar Personaje</button>
      <div id="msg"></div>
    </form>

    <div class="section-title" style="margin-top:50px;">Personajes creados</div>
    <table class="card-table">
      <thead><tr><th>Nombre</th><th>Rareza base</th><th></th></tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>

  <script>const NEXO_BASE = '../';</script>
  <script src="../js/data-client.js"></script>
  <script src="../js/effect-builder.js"></script>
  <script>
    function updatePreview() {
      const url = document.getElementById('imagenUrl').value.trim();
      const art = document.getElementById('previewArt');
      art.innerHTML = url ? `<img src="${url}" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.replaceWith('⚠️ URL inválida')" />` : '🂠';
    }
    document.getElementById('imagenUrl').addEventListener('input', updatePreview);

    function cardArtHtml(imagenUrl, size) {
      return imagenUrl
        ? `<img src="${imagenUrl}" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'" />`
        : `<span style="font-size:${size || 32}px;">🂠</span>`;
    }

    let editingId = null;
    async function init() {
      renderMovimientoSlots(document.getElementById('movimientos'));
      const rarities = await NexoData.rarities();
      await renderEffectSlots(document.getElementById('effectSlots'), {
        count: 5, unlockCounts: rarities.efectosDesbloqueados
      });
      renderList();
    }

    async function renderList() {
      const chars = await NexoData.characters();
      document.getElementById('listBody').innerHTML = chars.map(c => `
        <tr>
          <td>${c.nombre}</td>
          <td>${c.rareza}</td>
          <td>
            <button class="btn secondary" onclick="editChar('${c.id}')">Editar</button>
            <button class="btn danger" onclick="deleteChar('${c.id}')">Eliminar</button>
          </td>
        </tr>`).join('') || '<tr><td colspan="3">Aún no hay personajes creados.</td></tr>';
    }

    async function editChar(id) {
      const chars = await NexoData.characters();
      const c = chars.find(x => x.id === id);
      if (!c) return;
      editingId = id;
      document.getElementById('nombre').value = c.nombre;
      document.getElementById('rareza').value = c.rareza;
      document.getElementById('imagenUrl').value = c.imagenUrl || '';
      updatePreview();
      renderMovimientoSlots(document.getElementById('movimientos'), c.movimientos || []);
      const rarities = await NexoData.rarities();
      await renderEffectSlots(document.getElementById('effectSlots'), {
        count: 5, unlockCounts: rarities.efectosDesbloqueados, initial: c.pasivas || []
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteChar(id) {
      if (!confirm('¿Eliminar este personaje?')) return;
      await fetch(`/api/characters/${id}`, { method: 'DELETE' });
      NexoData.invalidate('characters.json');
      renderList();
    }

    function slugify(text) {
      return text.toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    }

    async function guardar() {
      const nombre = document.getElementById('nombre').value.trim();
      if (!nombre) return showMsg('El nombre es obligatorio.', false);
      const card = {
        id: editingId || slugify(nombre) + '_' + Date.now().toString(36),
        nombre,
        rareza: document.getElementById('rareza').value,
        imagenUrl: document.getElementById('imagenUrl').value.trim(),
        movimientos: serializeMovimientoSlots(document.getElementById('movimientos')),
        pasivas: serializeEffectSlots(document.getElementById('effectSlots')),
      };
      try {
        const res = await fetch('/api/characters', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(card)
        });
        if (!res.ok) throw new Error();
        NexoData.invalidate('characters.json');
        showMsg(`Personaje "${nombre}" guardado. Recuerda hacer commit/push para publicarlo.`, true);
        editingId = null;
        renderList();
      } catch (e) {
        showMsg('No se pudo guardar. ¿Está corriendo "npm run dev"?', false);
      }
    }

    function showMsg(text, ok) {
      const el = document.getElementById('msg');
      el.className = 'notice ' + (ok ? 'ok' : 'error');
      el.textContent = text;
      el.style.marginTop = '10px';
    }

    init();
  </script>
</body>
</html>
