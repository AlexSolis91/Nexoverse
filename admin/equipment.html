<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexoverse — Crear Equipo</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <script src="../js/admin-guard.js"></script>
  <div class="topbar">
    <div class="brand"><a href="../index.html" style="text-decoration:none;color:inherit;">NEXOVERSE</a></div>
    <a class="btn secondary" href="dashboard.html">Volver</a>
  </div>
  <div class="container">
    <div class="section-title">Crear Equipo</div>
    <div class="section-sub">5 efectos por carta, desbloqueo progresivo por rareza. Requisitos mínimos de talento opcionales.</div>

    <form class="builder" id="form" onsubmit="return false;">
      <div class="row">
        <div class="field">
          <label>Nombre</label>
          <input id="nombre" required />
        </div>
        <div class="field">
          <label>Rareza base (con la que dropea de cofres)</label>
          <select id="rareza">
            <option value="comun">Común</option>
            <option value="raro">Raro</option>
            <option value="especial">Especial</option>
            <option value="epico">Épico</option>
            <option value="legendario">Legendario</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Categoría</label>
          <select id="categoria">
            <option value="armas">Armas</option>
            <option value="equipacion">Equipación</option>
            <option value="accesorios">Accesorios</option>
          </select>
        </div>
        <div class="field">
          <label>Subtipo</label>
          <select id="subtipo"></select>
        </div>
      </div>
      <div class="row">
        <input id="nuevoSubtipo" placeholder="Nuevo subtipo (ej: Alabarda)" />
        <button type="button" class="btn secondary" onclick="addSubtipo()">+ Agregar subtipo</button>
      </div>

      <div class="block-box">
        <h4>Requisitos mínimos de talento para equipar</h4>
        <div id="requisitos"></div>
        <button type="button" class="btn secondary" onclick="addRequisito()">+ Agregar requisito</button>
      </div>

      <div class="block-box">
        <h4>Efectos (5, desbloqueo por rareza)</h4>
        <div class="effects-list" id="effectSlots"></div>
      </div>

      <button class="btn" onclick="guardar()">Guardar Equipo</button>
      <div id="msg"></div>
    </form>

    <div class="section-title" style="margin-top:50px;">Equipo creado</div>
    <table class="card-table">
      <thead><tr><th>Nombre</th><th>Categoría</th><th>Rareza base</th><th></th></tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>

  <script>const NEXO_BASE = '../';</script>
  <script src="../js/data-client.js"></script>
  <script src="../js/effect-builder.js"></script>
  <script>
    const TALENTOS = ['fuerza', 'intelecto', 'espiritu', 'vitalidad', 'agilidad'];

    async function renderSubtipos() {
      const types = await NexoData.equipmentTypes();
      const categoria = document.getElementById('categoria').value;
      const sel = document.getElementById('subtipo');
      sel.innerHTML = types[categoria].map(s => `<option value="${s}">${s}</option>`).join('');
    }
    document.getElementById('categoria').addEventListener('change', renderSubtipos);

    async function addSubtipo() {
      const categoria = document.getElementById('categoria').value;
      const subtipo = document.getElementById('nuevoSubtipo').value.trim();
      if (!subtipo) return;
      await fetch('/api/equipment-types', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ categoria, subtipo })
      });
      NexoData.invalidate('equipmentTypes.json');
      document.getElementById('nuevoSubtipo').value = '';
      await renderSubtipos();
      document.getElementById('subtipo').value = subtipo;
    }

    function addRequisito(data) {
      const wrap = document.getElementById('requisitos');
      const div = document.createElement('div');
      div.className = 'row';
      div.dataset.req = '1';
      div.innerHTML = `
        <select class="req-talento">${TALENTOS.map(t => `<option value="${t}">${t}</option>`).join('')}</select>
        <input type="number" class="req-cantidad" value="${data?.cantidad ?? 10}" />
        <button type="button" class="btn danger" onclick="this.closest('[data-req]').remove()">Quitar</button>
      `;
      if (data?.talento) div.querySelector('.req-talento').value = data.talento;
      wrap.appendChild(div);
    }

    function serializeRequisitos() {
      return Array.from(document.querySelectorAll('#requisitos [data-req]')).map(div => ({
        talento: div.querySelector('.req-talento').value,
        cantidad: Number(div.querySelector('.req-cantidad').value) || 0,
      }));
    }

    let editingId = null;
    async function init() {
      await renderSubtipos();
      const rarities = await NexoData.rarities();
      await renderEffectSlots(document.getElementById('effectSlots'), {
        count: 5, unlockCounts: rarities.efectosDesbloqueados
      });
      renderList();
    }

    async function renderList() {
      const items = await NexoData.equipment();
      document.getElementById('listBody').innerHTML = items.map(e => `
        <tr>
          <td>${e.nombre}</td>
          <td>${e.subtipo} (${e.categoria})</td>
          <td>${e.rareza}</td>
          <td>
            <button class="btn secondary" onclick="editItem('${e.id}')">Editar</button>
            <button class="btn danger" onclick="deleteItem('${e.id}')">Eliminar</button>
          </td>
        </tr>`).join('') || '<tr><td colspan="4">Aún no hay equipo creado.</td></tr>';
    }

    async function editItem(id) {
      const items = await NexoData.equipment();
      const e = items.find(x => x.id === id);
      if (!e) return;
      editingId = id;
      document.getElementById('nombre').value = e.nombre;
      document.getElementById('rareza').value = e.rareza;
      document.getElementById('categoria').value = e.categoria;
      await renderSubtipos();
      document.getElementById('subtipo').value = e.subtipo;
      document.getElementById('requisitos').innerHTML = '';
      (e.requisitos || []).forEach(addRequisito);
      const rarities = await NexoData.rarities();
      await renderEffectSlots(document.getElementById('effectSlots'), {
        count: 5, unlockCounts: rarities.efectosDesbloqueados, initial: e.efectos || []
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteItem(id) {
      if (!confirm('¿Eliminar este equipo?')) return;
      await fetch(`/api/equipment/${id}`, { method: 'DELETE' });
      NexoData.invalidate('equipment.json');
      renderList();
    }

    function slugify(text) {
      return text.toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    }

    async function guardar() {
      const nombre = document.getElementById('nombre').value.trim();
      if (!nombre) return showMsg('El nombre es obligatorio.', false);
      const card = {
        id: editingId || slugify(nombre) + '_' + Date.now().toString(36),
        nombre,
        rareza: document.getElementById('rareza').value,
        categoria: document.getElementById('categoria').value,
        subtipo: document.getElementById('subtipo').value,
        requisitos: serializeRequisitos(),
        efectos: serializeEffectSlots(document.getElementById('effectSlots')),
      };
      try {
        const res = await fetch('/api/equipment', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(card)
        });
        if (!res.ok) throw new Error();
        NexoData.invalidate('equipment.json');
        showMsg(`Equipo "${nombre}" guardado. Recuerda hacer commit/push para publicarlo.`, true);
        editingId = null;
        renderList();
      } catch (e) {
        showMsg('No se pudo guardar. ¿Está corriendo "npm run dev"?', false);
      }
    }

    function showMsg(text, ok) {
      const el = document.getElementById('msg');
      el.className = 'notice ' + (ok ? 'ok' : 'error');
      el.textContent = text;
      el.style.marginTop = '10px';
    }

    init();
  </script>
</body>
</html>
