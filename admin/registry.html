<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexoverse — Gatillos y Condiciones</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <script src="../js/admin-guard.js"></script>
  <div class="topbar">
    <div class="brand"><a href="../index.html" style="text-decoration:none;color:inherit;">NEXOVERSE</a></div>
    <a class="btn secondary" href="dashboard.html">Volver</a>
  </div>
  <div class="container">
    <div class="section-title">Gatillos y Condiciones</div>
    <div class="section-sub">Base única compartida entre la herramienta de Personajes y la de Equipo. Cualquier elemento nuevo aquí queda disponible en ambas.</div>

    <div class="row" style="align-items:flex-start;">
      <div class="block-box" style="flex:1;">
        <h4>Gatillos (Triggers)</h4>
        <table class="card-table" id="triggersTable"><tbody></tbody></table>
        <div class="row" style="margin-top:10px;">
          <input id="newTriggerId" placeholder="id_unico (ej: al_bloquear)" />
          <input id="newTriggerName" placeholder="Nombre visible (ej: Al bloquear un ataque)" />
        </div>
        <button class="btn" style="margin-top:10px;" onclick="addTrigger()">Agregar Gatillo</button>
      </div>

      <div class="block-box" style="flex:1;">
        <h4>Condiciones</h4>
        <table class="card-table" id="conditionsTable"><tbody></tbody></table>
        <div class="row" style="margin-top:10px;">
          <input id="newCondId" placeholder="id_unico (ej: objetivo_aturdido)" />
          <input id="newCondName" placeholder="Nombre visible (ej: El objetivo está Aturdido)" />
        </div>
        <button class="btn" style="margin-top:10px;" onclick="addCondition()">Agregar Condición</button>
      </div>
    </div>

    <div id="msg" style="margin-top:16px;"></div>
  </div>

  <script>const NEXO_BASE = '../';</script>
  <script src="../js/data-client.js"></script>
  <script>
    function showMsg(text, ok) {
      const el = document.getElementById('msg');
      el.className = 'notice ' + (ok ? 'ok' : 'error');
      el.textContent = text;
    }

    async function renderTriggers() {
      const triggers = await NexoData.triggers();
      const body = document.querySelector('#triggersTable tbody');
      body.innerHTML = triggers.map(t => `<tr><td>${t.id}</td><td>${t.nombre}</td></tr>`).join('');
    }
    async function renderConditions() {
      const conditions = await NexoData.conditions();
      const body = document.querySelector('#conditionsTable tbody');
      body.innerHTML = conditions.map(c => `<tr><td>${c.id}</td><td>${c.nombre}</td></tr>`).join('');
    }

    async function addTrigger() {
      const id = document.getElementById('newTriggerId').value.trim();
      const nombre = document.getElementById('newTriggerName').value.trim();
      if (!id || !nombre) return showMsg('Completa id y nombre.', false);
      try {
        const res = await fetch('/api/triggers', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, nombre })
        });
        if (!res.ok) throw new Error();
        NexoData.invalidate('triggers.json');
        showMsg('Gatillo agregado.', true);
        renderTriggers();
      } catch (e) {
        showMsg('No se pudo guardar. ¿Está corriendo "npm run dev"?', false);
      }
    }

    async function addCondition() {
      const id = document.getElementById('newCondId').value.trim();
      const nombre = document.getElementById('newCondName').value.trim();
      if (!id || !nombre) return showMsg('Completa id y nombre.', false);
      try {
        const res = await fetch('/api/conditions', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, nombre })
        });
        if (!res.ok) throw new Error();
        NexoData.invalidate('conditions.json');
        showMsg('Condición agregada.', true);
        renderConditions();
      } catch (e) {
        showMsg('No se pudo guardar. ¿Está corriendo "npm run dev"?', false);
      }
    }

    renderTriggers();
    renderConditions();
  </script>
</body>
</html>
